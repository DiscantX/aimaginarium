[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimaginarium"
version = "0.0.1"
description = "A D&D-style tabletop RPG engine in which an LLM acts as dungeon master."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
aimaginarium = "aimaginarium.ui.cli:main"

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["aimaginarium*"]

[tool.setuptools.package-data]
aimaginarium = ["prompts/library/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
]
