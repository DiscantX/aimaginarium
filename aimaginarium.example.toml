# Copy to aimaginarium.toml (git-ignored) and edit. API keys stay in .env.

# Retry policy for busy providers; override per provider with [providers.<name>.retry].
[retry]
attempts = 6
base_delay = 1.0
max_delay = 20.0
max_total_wait = 45.0

[providers.gemini]
kind = "gemini"
model = "gemini-3.5-flash-lite"
# api_key_env = "GEMINI_API_KEY"

[providers.local]
kind = "ollama"
model = "phi4-mini"
options = { num_thread = 2 }

# Per-model capability overrides (the shipped defaults are used otherwise).
[providers.local.capabilities.phi4-mini]
schema_enforcement = true
reports_cache = true

# A task is a named kind of LLM call. Each picks a provider and, optionally, a model,
# then fallbacks tried in order if it is unavailable ("provider" or "provider:model").
# Tasks not listed use "default". Tasks the engine uses:
#   narrate        every turn's first call (prose, state changes, and any check request)
#   check_outcome  second call of a check turn, after the roll
#   opening        first turn of a session
#   repair         re-asks for rejected state changes only
#   world_tick     faction and world events (no player waiting; needs strong reasoning)
#   summarize      history compression, established facts
#   player         the LLM-driven test player
[tasks.default]
provider = "gemini"

[tasks.narrate]
provider = "gemini"
# model = "gemini-3.5-flash"
fallback = ["local"]

[tasks.summarize]
provider = "local"

# A provider that was unavailable is skipped for this many seconds.
[fallback]
cooldown = 60
